<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04081D"/>
      <stop offset="1" stop-color="#030514"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#17335C" stroke-opacity="0.24"/>
    </pattern>
    <marker id="arrowMint" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#57EFB5"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5A9DFF"/>
    </marker>
    <style>
      .h1 { font: 700 34px 'SF Pro Display','Segoe UI',Arial,sans-serif; fill: #DFEAFF; }
      .sub { font: 500 17px 'SF Pro Text','Segoe UI',Arial,sans-serif; fill: #9BB4D6; }
      .boxTitle { font: 700 24px 'SF Pro Display','Segoe UI',Arial,sans-serif; fill: #ECF5FF; }
      .boxBody { font: 520 15px 'SF Pro Text','Segoe UI',Arial,sans-serif; fill: #A0B7D8; }
      .label { font: 600 13px 'SF Mono','Menlo','Consolas',monospace; fill: #89AFDE; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="72" y="78" class="h1">Aura Architecture Overview</text>
  <text x="72" y="108" class="sub">Simple judge view: multimodal loop, native execution, cloud memory</text>

  <rect x="80" y="220" width="310" height="210" rx="18" fill="#101E3C" fill-opacity="0.82" stroke="#57EFB5" stroke-width="1.8"/>
  <text x="108" y="274" class="boxTitle">User + macOS</text>
  <text x="108" y="304" class="boxBody">Voice input (16kHz)</text>
  <text x="108" y="328" class="boxBody">Screen stream (2 FPS + AX)</text>
  <text x="108" y="352" class="boxBody">Keyboard and mouse actions</text>

  <rect x="470" y="190" width="430" height="280" rx="20" fill="#152A4D" fill-opacity="0.84" stroke="#57EFB5" stroke-width="2.2"/>
  <text x="504" y="262" class="boxTitle">aura-daemon (Rust core)</text>
  <text x="504" y="294" class="boxBody">Orchestrator + event bus + tool routing</text>
  <text x="504" y="320" class="boxBody">Coordinates voice, screen, memory, safety</text>
  <text x="504" y="346" class="boxBody">Calls native tools (click, type, script)</text>

  <rect x="470" y="520" width="205" height="110" rx="14" fill="#251945" fill-opacity="0.82" stroke="#8F72FF" stroke-width="1.7"/>
  <text x="498" y="566" class="boxTitle" font-size="20">SQLite</text>
  <text x="498" y="592" class="boxBody">Local sessions + cache</text>

  <rect x="695" y="520" width="205" height="110" rx="14" fill="#2B2316" fill-opacity="0.82" stroke="#FFB65E" stroke-width="1.7"/>
  <text x="723" y="566" class="boxTitle" font-size="20">Safety gates</text>
  <text x="723" y="592" class="boxBody">Shell + app restrictions</text>

  <rect x="980" y="230" width="270" height="120" rx="16" fill="#102747" fill-opacity="0.82" stroke="#5A9DFF" stroke-width="1.9"/>
  <text x="1008" y="282" class="boxTitle">Gemini Live API</text>
  <text x="1008" y="308" class="boxBody">Bidirectional WS (audio + vision)</text>

  <rect x="1290" y="190" width="240" height="280" rx="20" fill="#102747" fill-opacity="0.82" stroke="#5A9DFF" stroke-width="1.9"/>
  <text x="1320" y="248" class="boxTitle" font-size="22">Cloud Run</text>
  <text x="1320" y="278" class="boxBody">aura-proxy</text>
  <text x="1320" y="302" class="boxBody">memory-agent (ADK)</text>
  <text x="1320" y="338" class="boxBody">Auth, relay, consolidation</text>

  <rect x="1290" y="520" width="240" height="110" rx="14" fill="#102747" fill-opacity="0.82" stroke="#5A9DFF" stroke-width="1.7"/>
  <text x="1320" y="566" class="boxTitle" font-size="22">Firestore</text>
  <text x="1320" y="592" class="boxBody">Cross-session facts</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M390 325H470" stroke="#57EFB5" stroke-width="2.4" marker-end="url(#arrowMint)"/>
    <path d="M900 286H980" stroke="#5A9DFF" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
    <path d="M980 324H900" stroke="#5A9DFF" stroke-width="2.1" marker-end="url(#arrowBlue)" stroke-dasharray="6 6"/>
    <path d="M1250 290H1290" stroke="#5A9DFF" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
    <path d="M1410 470V520" stroke="#5A9DFF" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
    <path d="M560 470V520" stroke="#8F72FF" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
    <path d="M805 470V520" stroke="#FFB65E" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  </g>

  <text x="418" y="316" class="label">audio + vision + intent</text>
  <text x="910" y="272" class="label">stream up</text>
  <text x="905" y="344" class="label">speech + tools back</text>
  <text x="1260" y="278" class="label">relay / memory</text>

  <rect x="80" y="700" width="1450" height="94" rx="14" fill="#0F1B39" fill-opacity="0.72" stroke="#284F79"/>
  <text x="110" y="742" class="boxBody" font-size="16">Judge focus: Beyond-text live interaction, clear cloud deployment, and grounded observe-act-verify behavior.</text>
  <text x="1496" y="742" class="boxBody" font-size="16" text-anchor="end">Aura</text>
</svg>
