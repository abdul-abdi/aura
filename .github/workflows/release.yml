name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "release" to confirm'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: macos-15
    timeout-minutes: 45
    if: github.event_name == 'push' || github.event.inputs.confirm == 'release'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Triggered by tag push — extract version from tag
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            # Triggered manually — read version from VERSION
            VERSION=$(cat VERSION)
          fi
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not determine version"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "### Release v${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify VERSION matches release
        run: |
          FILE_VERSION=$(cat VERSION)
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [[ "$FILE_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::VERSION ($FILE_VERSION) does not match release version (v$TAG_VERSION). Update VERSION first."
            exit 1
          fi

      - name: Check tag does not already exist
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git tag -l "v${VERSION}" | grep -q .; then
            echo "::error::Tag v${VERSION} already exists. Bump VERSION."
            exit 1
          fi

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Test
        run: swift test

      - name: Build Aura.app and DMG
        run: bash scripts/bundle.sh --dmg

      - name: Fetch tags for release notes
        run: git fetch --tags

      - name: Generate release notes
        id: notes
        run: |
          NOTES=$(bash scripts/generate-release-notes.sh)
          # Write to file to avoid shell escaping issues
          echo "$NOTES" > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Aura v${{ steps.version.outputs.version }}
          body_path: /tmp/release-notes.md
          files: build/Aura-${{ steps.version.outputs.version }}.dmg

